<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <title>Projeto Login</title>
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo novamente! Faça seu login para continuar e entrar em sua conta.</p>
                <form action="login.php" method="post" autocomplete="on">
                    <div class="campo">
                        <span class="material-symbols-outlined">person</span>
                        <input type="email" id="username" name="username" placeholder="Seu usuario" autocomplete="email" required maxlength="30">
                        <label for="username"></label>
                    </div>
                    <div class="campo">
                        <span class="material-symbols-outlined">password</span>
                        <input type="password" id="password" name="password" placeholder="Sua senha" autocomplete="current-password" required mminlength="8" maxlength="20">
                        <label for="password"></label>
                    </div>
                    <div class="campo">
                        <button type="submit">Entrar</button>
                        <button type="forgot-password" class="butao">Esqueci minha senha</button>

                    </div>

                    </div>
                </form>
            </div>
        </section>
    </main>
    
</body>
</html>
